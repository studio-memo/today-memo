<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のメモ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>今日のメモ</h1>

    <div id="memoList">
      <div class="memo-item">□ 水切りネット</div>
      <div class="memo-item">☑ 果物買う</div>
    </div>

    <button id="addButton" class="add-button">＋</button>
    <div id="modal" class="modal hidden">

  <div class="modal-content">

    <h2>タスクを追加</h2>

    <input
      type="text"
      id="memoInput"
      class="memo-input"
    >

    <div class="modal-buttons">
      <button id="cancelButton">キャンセル</button>
      <button id="saveButton">保存</button>
    </div>

  </div>

</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
